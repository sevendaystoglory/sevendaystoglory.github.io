---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-kicker">
      {%- case page.category -%}
        {%- when "til" -%}TIL
        {%- when "projects" -%}Project
        {%- when "blogs" -%}Blog
        {%- else -%}Post
      {%- endcase -%}
      <span class="post-kicker-sep">·</span>{{ page.date | date: "%b %-d, %Y" }}
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>

# Site settings
title: Nishant Sharma
email: nishant.sharma@mila.quebec
description: >-
  Nishant Sharma — Research MSc student at Mila working on AI safety and the
  geometry of deep learning.
baseurl: "" # remove the "/" to prevent double slashes
url: "https://sevendaystoglory.github.io"
twitter_username: nishantsh2002
github_username: sevendaystoglory

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed 
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git/ 
  - .gitignore
  - _site/

collections:
  posts:
    output: true
    permalink: _posts/:categories/:year/:month/:day/:title/

defaults:
  - scope:
      path: "_posts/blogs"
    values:
      category: blogs
  - scope:
      path: "_posts/til"
    values:
      category: til
  - scope:
      path: "_posts/projects"
    values:
      category: projects
# Private visit log (see visit-tracker/README.md). Leave empty to switch it off.
visit_tracker_url: "https://visit-tracker.sevendaystoglory.workers.dev"

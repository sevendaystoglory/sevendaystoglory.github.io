<div class="compact-grid">
{%- for post in site.posts -%}
{%- if post.category == 'blogs' or post.category == 'til' -%}
  <a class="compact-card" href="{{ post.url | relative_url }}">
    <div class="compact-body">
      <div class="compact-title">{{ post.title }}</div>
      <div class="compact-meta">{{ post.date | date: "%b %-d, %Y" }}{% if post.category == 'til' %} · <span class="tag">TIL</span>{% endif %}</div>
    </div>
    <span class="compact-link" aria-hidden="true">→</span>
  </a>
{%- endif -%}
{%- endfor -%}
</div>

<aside class="sidebar">

        <a href="/" class="ascii-photo-link" aria-label="Home">
            <span class="ascii-photo-wrap">
                <video class="ascii-photo-video" src="/assets/videos/profile.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
                <canvas class="ascii-photo-canvas" aria-hidden="true"></canvas>
                <img src="/assets/images/profile.jpg" alt="Nishant Sharma" class="ascii-photo">
            </span>
        </a>

        <h1 class="sidebar-name">Nishant Sharma</h1>
